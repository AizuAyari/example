[project]
name = "example"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.18",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["**/migrations/*", "main.py", "example.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}The Blogs{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
    <script src="https://unpkg.com/htmx.org@2"></script>
</head>
<body>
    <header class="site-header">
        <nav class="site-nav" aria-label="メインナビゲーション">
            <div class="site-nav__bar">
                <a class="site-nav__brand" href="{% url 'home' %}">The Blogs</a>
                <button type="button" class="site-nav__toggle" aria-expanded="false" aria-controls="site-nav-links" aria-label="メニューを開閉">
                    <span aria-hidden="true">☰</span>
                </button>
            </div>
            <div class="site-nav__links" id="site-nav-links">
                <a href="{% url 'article_list' %}">記事一覧</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'article_create' %}">新規投稿</a>
                    <span class="site-nav__welcome">ようこそ、{{ user.username }} さん</span>
                    <form class="site-nav__logout-form" method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit">ログアウト</button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}">ログイン</a>
                    <a href="{% url 'register' %}">新規登録</a>
                {% endif %}
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script>
        (function () {
            var toggle = document.querySelector(".site-nav__toggle");
            var links = document.getElementById("site-nav-links");
            toggle.addEventListener("click", function () {
                var expanded = toggle.getAttribute("aria-expanded") === "true";
                toggle.setAttribute("aria-expanded", String(!expanded));
                links.classList.toggle("is-open");
            });
        })();
    </script>
</body>
</html>

{% extends "blog/base.html" %}

{% block title %}{{ article.title }} - The Blogs{% endblock %}

{% block content %}
<article class="article-detail">
    <h1>{{ article.title }}</h1>
    <div class="article-list__meta">{{ article.author.username }} ・ {{ article.created_at|date:"Y-m-d" }}</div>
    <p>{{ article.content|linebreaks }}</p>
</article>
{% endblock %}
